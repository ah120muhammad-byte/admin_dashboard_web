services:
  - type: web
    name: medidata-r2-backend
    runtime: docker
    rootDir: r2_backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: medidata-videos
      - key: R2_ENDPOINT
        sync: false
      - key: SUPABASE_URL
        value: https://eoyehpqknyoksaxlvnwl.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ALLOWED_ADMIN_USER_IDS
        value: ""
