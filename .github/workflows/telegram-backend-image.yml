name: Build Telegram Backend Image

on:
  push:
    branches: [main]
    paths:
      - "telegram_backend/**"
      - ".github/workflows/telegram-backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./telegram_backend
          file: ./telegram_backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/medidata-telegram-backend:latest
