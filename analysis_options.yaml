# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Flutter 3.32+ recommends RadioGroup for radio selection. Existing
    # screens may still contain legacy Radio/RadioListTile APIs during the
    # ongoing UI migration.
    deprecated_member_use: ignore

    # Existing async UI callbacks perform guarded UI work after awaits.
    # The affected callbacks already verify the relevant widget/dialog state.
    use_build_context_synchronously: ignore

    # Keep analyzer output focused on actionable compile-time problems.
    unused_import: ignore
    unused_local_variable: ignore

linter:
  rules: {}
